<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Earth Adventure · Admin</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17302b;--muted:#5d716c;--line:#dbe3e0;--brand:#0f5c4d;--brand-d:#0a4439;--warn:#b45309;--bad:#b42318;--ok:#067647;--soft:#e8f1ee}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0 0 .5em;line-height:1.25}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}
a{color:var(--brand)}button,input,select,textarea{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{background:var(--brand);color:#fff}header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
header.top strong{font-size:1.05rem}header.top nav{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:12px}
header.top nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer}
header.top nav button[aria-current=true]{background:#fff;color:var(--brand)}
header.top .sp{flex:1}header.top .who{opacity:.85;font-size:.9rem}

.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:1.6rem}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.9rem}label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{background:var(--brand-d)}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}.btn.bad{background:var(--bad)}.btn.sm{padding:4px 9px;font-size:.85rem}.btn[disabled]{opacity:.55;cursor:wait}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{background:var(--soft);white-space:nowrap}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft);color:var(--brand)}
.badge.pending{background:#fff4d6;color:#8a5a00}.badge.contacted{background:#e0ecff;color:#1c4fa3}.badge.confirmed{background:#dcf5e6;color:var(--ok)}.badge.cancelled{background:#fde4e1;color:var(--bad)}.badge.off{background:#eee;color:#555}.badge.warn{background:#fde9d3;color:var(--warn)}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}.msg.err{background:#fde4e1;color:var(--bad)}.msg.ok{background:#dcf5e6;color:var(--ok)}.msg.info{background:var(--soft)}

.bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bi [dir=rtl]{text-align:right}

.list-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fbfcfb}
.thumb{width:140px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
.login{max-width:420px;margin:8vh auto}

.center{text-align:center}.mt{margin-top:12px}
</style>
</head>
<body>
<div id="app"><p class="wrap muted">Loading…</p></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var state={session:null,view:'dashboard',trips:null,tripId:null,filters:{q:'',status:'',trip:'',from:'',to:'',email:'',offset:0},toast:null};

/* ---------- tiny DOM helper: text is always set with textContent, never as HTML ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v===null||v===undefined||v===false)return;
    if(k==='class')el.className=v;
    else if(k==='on')Object.keys(v).forEach(function(ev){el.addEventListener(ev,v[ev])});
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else if(k==='selected')el.selected=!!v;
    else if(k==='disabled')el.disabled=!!v;
    else el.setAttribute(k,v===true?'':String(v));
  });
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){
  if(c===null||c===undefined||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(el,x)});return}
  el.appendChild(typeof c==='object'&&c.nodeType?c:document.createTextNode(String(c)));
}
function show(node){app.textContent='';app.appendChild(node)}
function toast(msg){
  state.toast=msg;var t=h('div',{class:'toast',role:'status'},msg);document.body.appendChild(t);
  setTimeout(function(){t.remove()},3500);
}

/* ---------- API ---------- */
function api(method,path,body,raw){
  var opts={method:method,credentials:'same-origin',headers:{'X-Requested-With':'ea-admin'}};
  if(raw){opts.body=raw.body;opts.headers['Content-Type']=raw.type}
  else if(body!==undefined){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json'}
  return fetch('/api/admin'+path,opts).then(function(r){
    return r.json().catch(function(){return{}}).then(function(d){
      if(r.status===401&&path!=='/login'&&path!=='/setup'){state.session=null;boot();throw new Error('Please log in again.')}
      if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));
      return d;
    });
  });
}
function errBox(e){return h('div',{class:'msg err',role:'alert'},e&&e.message?e.message:String(e))}

/* ---------- boot / auth ---------- */
function boot(){
  fetch('/api/admin/session',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(s){
    state.session=s;
    if(!s.dbConnected)return show(h('div',{class:'wrap login card'},h('h1',null,'Database not ready'),
      h('p',null,'The D1 database is not connected or has not been migrated yet. Follow DEPLOY.txt (steps 1–4), then reload this page.')));
    if(s.needsSetup)return setupView();
    if(!s.authenticated)return loginView();
    renderShell();
  }).catch(function(e){show(h('div',{class:'wrap'},errBox(e)))});
}
function loginView(){
  var err=h('div');var u=h('input',{id:'u',autocomplete:'username',required:true});var p=h('input',{id:'p',type:'password',autocomplete:'current-password',required:true});
  var btn=h('button',{class:'btn',type:'submit'},'Log in');
  var form=h('form',{on:{submit:function(ev){ev.preventDefault();btn.disabled=true;err.textContent='';
    api('POST','/login',{username:u.value,password:p.value}).then(boot).catch(function(e){err.appendChild(errBox(e));btn.disabled=false})}}},
    h('label',{for:'u'},'Username'),u,h('label',{for:'p'},'Password'),p,err,h('div',{class:'mt'},btn));
  show(h('div',{class:'wrap login card'},h('h1',null,'Earth Adventure admin'),h('p',{class:'muted'},'Administrator login'),form));
  u.focus();
}
function setupView(){
  var err=h('div');var t=h('input',{id:'t',type:'password',autocomplete:'off',required:true});var u=h('input',{id:'u',autocomplete:'username',required:true});var p=h('input',{id:'p',type:'password',autocomplete:'new-password',required:true});
  var btn=h('button',{class:'btn',type:'submit'},'Create administrator');
  var form=h('form',{on:{submit:function(ev){ev.preventDefault();btn.disabled=true;err.textContent='';
    api('POST','/setup',{token:t.value,username:u.value,password:p.value}).then(boot).catch(function(e){err.appendChild(errBox(e));btn.disabled=false})}}},
    h('label',{for:'t'},'Setup token ',h('small',null,'(the ADMIN_SETUP_TOKEN secret you set in Cloudflare)')),t,
    h('label',{for:'u'},'Choose a username'),u,
    h('label',{for:'p'},'Choose a password ',h('small',null,'(at least 10 characters, letters and numbers)')),p,err,h('div',{class:'mt'},btn));
  show(h('div',{class:'wrap login card'},h('h1',null,'First-time setup'),h('p',{class:'muted'},'Create the administrator account. This screen only works while no administrator exists.'),form));
}
function logout(){api('POST','/logout',{}).finally(boot)}

/* ---------- shell ---------- */
function renderShell(){
  var views=[['dashboard','Overview'],['trips','Trips'],['bookings','Bookings'],['about','About page'],['gallery','Gallery page'],['account','Account']];
  var nav=h('nav',null,views.map(function(v){return h('button',{type:'button','aria-current':state.view===v[0]||(v[0]==='trips'&&state.view==='trip'),on:{click:function(){go(v[0])}}},v[1])}));
  var main=h('div',{class:'wrap',id:'main'});
  show(h('div',null,h('header',{class:'top'},h('div',{class:'wrap'},h('strong',null,'Earth Adventure admin'),nav,h('span',{class:'sp'}),h('a',{href:'/',target:'_blank',rel:'noopener',style:'color:#fff'},'View website'),h('span',{class:'who'},state.session.username),h('button',{class:'btn sec sm',type:'button',on:{click:logout}},'Log out'))),main));
  ({dashboard:dashboardView,trips:tripsView,trip:tripView,bookings:bookingsView,about:aboutView,gallery:galleryAdminView,account:accountView})[state.view](main);
}
function go(view,extra){state.view=view;if(extra)Object.keys(extra).forEach(function(k){state[k]=extra[k]});renderShell()}
function loading(main){main.textContent='';main.appendChild(h('p',{class:'muted'},'Loading…'))}
function fmtDate(d){return d||''}
function fmtDateTime(iso){try{return new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Muscat'})}catch(e){return iso}}
function badge(status){return h('span',{class:'badge '+status},status)}

/* ---------- dashboard ---------- */
function dashboardView(main){
  loading(main);
  api('GET','/summary').then(function(d){
    var counts={};d.byStatus.forEach(function(r){counts[r.status]=r.n});
    main.textContent='';
    main.appendChild(h('h1',null,'Overview'));
    main.appendChild(h('div',{class:'grid g3'},
      ['pending','contacted','confirmed','cancelled'].map(function(s){return h('div',{class:'stat'},h('b',null,counts[s]||0),h('span',null,s+' bookings'))}),
      h('div',{class:'stat'},h('b',null,d.counts.active_trips||0),h('span',null,'trips shown on website ('+(d.counts.trips||0)+' total)'))));
    if(d.counts.email_unsent>0)main.appendChild(h('div',{class:'msg info mt'},d.counts.email_unsent+' booking(s) were saved but the notification e-mail was not delivered. ',h('a',{href:'#',on:{click:function(e){e.preventDefault();state.filters=Object.assign({},state.filters,{email:'unsent',offset:0});go('bookings')}}},'Show them'),' and use “Resend e-mail”.'));
    main.appendChild(h('div',{class:'card mt'},h('h2',null,'Upcoming departures'),
      d.upcoming.length?h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['Trip','Date','Time','Seats booked','Status'].map(function(x){return h('th',null,x)}))),
        h('tbody',null,d.upcoming.map(function(s){return h('tr',null,h('td',null,s.trip_name),h('td',null,s.departure_date),h('td',null,s.departure_time||'—'),h('td',null,s.seats_booked+' / '+s.capacity),h('td',null,s.status==='open'?(s.seats_booked>=s.capacity?badge('cancelled'):badge('confirmed')):badge('off')))})))):h('p',{class:'muted'},'No upcoming departures. Add one from Trips → a group trip.')));
  }).catch(function(e){main.textContent='';main.appendChild(errBox(e))});
}

/* ---------- trips list ---------- */
var KIND={group:'Group trip',private:'Private trip',experience:'Experience'};
function tripsView(main){
  loading(main);
  api('GET','/trips').then(function(d){
    state.trips=d.trips;main.textContent='';
    main.appendChild(h('div',{class:'row'},h('h1',{style:'flex:1'},'Trips'),
      h('button',{class:'btn',type:'button',on:{click:function(){go('trip',{tripId:'new:group'})}}},'+ Group trip'),
      h('button',{class:'btn sec',type:'button',on:{click:function(){go('trip',{tripId:'new:private'})}}},'+ Private trip'),
      h('button',{class:'btn sec',type:'button',on:{click:function(){go('trip',{tripId:'new:experience'})}}},'+ Experience')));
    main.appendChild(h('p',{class:'muted'},'Group trips have dates and seats. Private trips and experiences are request-style trips (the customer picks a date). Hidden trips stay in the list but are not shown on the website.'));
    var t=h('table',null,h('thead',null,h('tr',null,['Name','Type','Price','Departures','Bookings','Visible',''].map(function(x){return h('th',null,x)}))),
      h('tbody',null,d.trips.map(function(r){
        return h('tr',null,h('td',null,h('strong',null,r.name_en),h('div',{class:'muted',dir:'rtl'},r.name_ar)),
          h('td',null,KIND[r.kind]+(r.region==='international'?' · intl':'')+(r.is_sample?' · sample':'')),
          h('td',null,priceText(r)),h('td',null,r.kind==='group'?r.schedule_count:'—'),h('td',null,r.booking_count),
          h('td',null,r.is_active?badge('confirmed'):badge('off')),
          h('td',null,h('button',{class:'btn sm',type:'button',on:{click:function(){go('trip',{tripId:r.id})}}},'Edit')));
      })));
    main.appendChild(h('div',{class:'card scroll'},t));
  }).catch(function(e){main.textContent='';main.appendChild(errBox(e))});
}
function priceText(r){if(r.price===null||r.price_type==='contact')return 'Contact for price';return 'OMR '+r.price+(r.price_type==='person'?' / person':r.price_type==='group'?' / group':'')}

/* ---------- trip editor ---------- */
var CATS=[['sea-fishing','Sea & Fishing'],['camping-overnight','Camping & Overnight'],['land-adventures','Land Adventures'],['international','International']];
var ASSETS=[['asset:coast','Built-in: coast'],['asset:camping','Built-in: camping'],['asset:wadi','Built-in: wadi'],['asset:mountains','Built-in: mountains']];
function field(label,input,hint){return h('div',null,h('label',null,label),input,hint?h('p',{class:'hint'},hint):null)}
function biField(label,en,ar,multiline,hint){
  var mk=function(v,dir,ph){return h(multiline?'textarea':'input',{value:v||'',dir:dir,placeholder:ph})};
  var a=mk(en,'ltr','English'),b=mk(ar,'rtl','العربية');
  var box=h('div',null,h('label',null,label),h('div',{class:'bi'},a,b),hint?h('p',{class:'hint'},hint):null);
  box.get=function(){return{en:a.value,ar:b.value}};return box;
}
function listEditor(title,items,withText){
  var rows=[];var holder=h('div');
  function addRow(v){
    var title_=biField(withText?'Title':'Item',v&&(withText?v.title.en:v.en),v&&(withText?v.title.ar:v.ar),false);
    var text_=withText?biField('Details',v&&v.text.en,v&&v.text.ar,true):null;
    var row=h('div',{class:'list-item'},title_,text_);
    var rm=h('button',{class:'btn bad sm mt',type:'button',on:{click:function(){row.remove();rows=rows.filter(function(r){return r!==entry})}}},'Remove');row.appendChild(rm);
    var entry={get:function(){return withText?{title:title_.get(),text:text_.get()}:title_.get()},blank:function(){var x=withText?title_.get():title_.get();return !x.en&&!x.ar&&(!withText||(!text_.get().en&&!text_.get().ar))}};
    rows.push(entry);holder.appendChild(row);
  }
  (items||[]).forEach(addRow);
  var box=h('div',{class:'mt'},h('h3',null,title),holder,h('button',{class:'btn sec sm',type:'button',on:{click:function(){addRow(null)}}},'+ Add'));
  box.get=function(){return rows.filter(function(r){return !r.blank()}).map(function(r){return r.get()})};
  return box;
}
function imagePicker(initial,saveHint){
  var value=initial||'';var preview=h('img',{class:'thumb',alt:''});var urlIn=h('input',{placeholder:'https://… (optional)'});
  var status=h('p',{class:'hint'});
  function resolve(v){if(!v)return '';if(v.indexOf('asset:')===0)return '';return v}
  function refresh(){
    var src=resolve(value);preview.style.display=src?'':'none';if(src)preview.src=src;
    status.textContent=!value?'No image selected (a neutral placeholder is shown).':value.indexOf('asset:')===0?'Using a picture that ships with the website ('+value.slice(6)+').':'Image: '+value;
    sel.value=value.indexOf('asset:')===0?value:'';
  }
  var sel=h('select',{on:{change:function(){if(sel.value){value=sel.value;refresh()}}}},h('option',{value:''},'Built-in pictures…'),ASSETS.map(function(a){return h('option',{value:a[0]},a[1])}));
  var file=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp',on:{change:function(){
    var f=file.files[0];if(!f)return;status.textContent='Preparing image…';
    shrink(f).then(function(blob){status.textContent='Uploading…';return api('POST','/images',undefined,{body:blob,type:blob.type})})
      .then(function(r){value=r.url;refresh();toast('Image uploaded. '+(saveHint||'Remember to save the trip.'))})
      .catch(function(e){status.textContent='';status.appendChild(errBox(e))});
  }}});
  var useUrl=h('button',{class:'btn sec sm',type:'button',on:{click:function(){var v=urlIn.value.trim();if(!v)return;if(!/^https:\/\//.test(v)){status.textContent='Use an address starting with https://';return}value=v;urlIn.value='';refresh()}}},'Use address');
  var clear=h('button',{class:'btn sec sm',type:'button',on:{click:function(){value='';refresh()}}},'Remove image');
  var box=h('div',null,h('label',null,'Image'),h('div',{class:'row'},preview,h('div',{style:'flex:1;min-width:220px'},h('div',null,'Upload a photo (JPG, PNG or WebP): ',file),h('div',{class:'row mt'},sel,clear),h('div',{class:'row mt'},urlIn,useUrl))),status);
  box.get=function(){return value||null};refresh();return box;
}
/* extra photos for a group trip: several uploads, reorder, remove (shown as a slideshow on the website) */
function galleryPicker(initial,opts){
  opts=opts||{};
  var list=(initial||[]).filter(function(x){return typeof x==='string'&&x});
  var grid=h('div',{class:'row mt',style:'align-items:flex-start'});
  var status=h('p',{class:'hint'});var urlIn=h('input',{placeholder:'https://… (optional)'});
  function src(v){return v.indexOf('asset:')===0?'':v}
  function move(i,d){var j=i+d;if(j<0||j>=list.length)return;var x=list[i];list[i]=list[j];list[j]=x;refresh()}
  function refresh(){
    grid.textContent='';
    list.forEach(function(v,i){
      var im=h('img',{class:'thumb',alt:'',style:'width:110px;height:76px'});if(src(v))im.src=src(v);
      grid.appendChild(h('div',{style:'text-align:center'},im,
        h('div',{class:'row',style:'justify-content:center;gap:4px;margin-top:4px'},
          h('button',{class:'btn sec sm',type:'button',title:'Move earlier',on:{click:function(){move(i,-1)}}},'◀'),
          h('button',{class:'btn sec sm',type:'button',title:'Move later',on:{click:function(){move(i,1)}}},'▶'),
          h('button',{class:'btn bad sm',type:'button',title:'Remove',on:{click:function(){list.splice(i,1);refresh()}}},'✕'))));
    });
    status.textContent=list.length?list.length+(opts.countText||' extra photo(s). The main image above is always the first one shown.'):(opts.emptyText||'No extra photos yet. Add some to turn the trip into a slideshow.');
  }
  var file=h('input',{type:'file',multiple:true,accept:'image/jpeg,image/png,image/webp',on:{change:function(){
    var files=Array.prototype.slice.call(file.files||[]);if(!files.length)return;
    var room=12-list.length;if(files.length>room){files=files.slice(0,Math.max(0,room));toast('Up to 12 extra photos. The rest were skipped.')}
    var done=0;status.textContent='Uploading 0/'+files.length+'…';
    files.reduce(function(chain,f){return chain.then(function(){
      return shrink(f).then(function(blob){return api('POST','/images',undefined,{body:blob,type:blob.type})}).then(function(r){list.push(r.url);done++;status.textContent='Uploading '+done+'/'+files.length+'…';refresh()});
    })},Promise.resolve()).then(function(){file.value='';refresh();toast(done+' photo(s) uploaded. '+(opts.saveHint||'Remember to save the trip.'))})
      .catch(function(e){file.value='';refresh();status.appendChild(errBox(e))});
  }}});
  var useUrl=h('button',{class:'btn sec sm',type:'button',on:{click:function(){var v=urlIn.value.trim();if(!v)return;if(!/^https:\/\//.test(v)){status.textContent='Use an address starting with https://';return}if(list.length>=12){status.textContent='Up to 12 extra photos.';return}list.push(v);urlIn.value='';refresh()}}},'Add address');
  var box=h('div',{class:'mt'},h('label',null,opts.label||'Extra photos (slideshow)'),
    h('div',null,'Add several photos at once (JPG, PNG or WebP): ',file),
    grid,h('div',{class:'row mt'},urlIn,useUrl),status);
  box.get=function(){return list.slice()};refresh();return box;
}
/* shrink big photos in the browser so they fit comfortably in the database */
function shrink(file){
  return new Promise(function(resolve,reject){
    if(file.size>12*1024*1024)return reject(new Error('That file is too large. Choose a photo under 12 MB.'));
    var img=new Image();var url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1200,w=img.naturalWidth,hh=img.naturalHeight,s=Math.min(1,max/Math.max(w,hh));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(hh*s);
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      var q=0.78;(function attempt(){c.toBlob(function(b){
        if(!b)return reject(new Error('Could not process this image.'));
        if(b.size>1100000&&q>0.4){q-=0.15;return attempt()}
        if(b.size>1100000)return reject(new Error('Image is still too large. Try a smaller picture.'));
        resolve(b)},'image/jpeg',q)})();
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('This file is not a readable image.'))};
    img.src=url;
  });
}
/* ---------- About page pictures ---------- */
var ABOUT_SLOTS=[

    b.special_requirements?h('p',null,h('strong',null,'Special requirements: '),b.special_requirements):null,
    b.additional_notes?h('p',null,h('strong',null,'Notes from customer: '),b.additional_notes):null,
    h('div',{class:'grid g3 mt'},field('Status',status),field('Participants',count,'Changing this checks seat capacity.')),
    h('label',null,'Admin notes'),notes,
    h('div',{class:'row mt'},save,cancel,resend,del),err);
}

/* ---------- account ---------- */
function accountView(main){
  main.textContent='';
  var cur=h('input',{type:'password',autocomplete:'current-password'}),nw=h('input',{type:'password',autocomplete:'new-password'}),err=h('div');
  var btn=h('button',{class:'btn',type:'button',on:{click:function(){err.textContent='';btn.disabled=true;
    api('POST','/password',{current:cur.value,next:nw.value}).then(function(){toast('Password changed. Other sessions were logged out.');cur.value='';nw.value='';btn.disabled=false}).catch(function(e){err.appendChild(errBox(e));btn.disabled=false})}}},'Change password');
  main.appendChild(h('h1',null,'Account'));
  main.appendChild(h('div',{class:'card',style:'max-width:460px'},h('h2',null,'Change password'),field('Current password',cur),field('New password (min. 10 characters, letters and numbers)',nw),err,h('div',{class:'mt'},btn)));
}

boot();
})();
</script>
</body>
</html>
